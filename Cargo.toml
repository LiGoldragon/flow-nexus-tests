[package]
name = "flow-nexus-anatomy-tests"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-flow-nexus/datom", "meta-signal-flow-nexus/datom", "flow-nexus-types/datom"]

[dependencies]
flow-nexus-runtime = { path = "flow-nexus/crates/runtime" }
flow-nexus-types = { path = "flow-nexus/crates/types" }
flow-nexus-platform = { path = "flow-nexus/crates/platform" }
signal-flow-nexus = { path = "signal-flow-nexus", features = [] }
meta-signal-flow-nexus = { path = "meta-signal-flow-nexus", features = [] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eb10157a0336e3aa2401e5b2046211fc8e736397", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eb10157a0336e3aa2401e5b2046211fc8e736397" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }

memory = { git = "https://github.com/LiGoldragon/memory", rev = "bfdde49897d060ce29f962ee35bdfaed3b50dd6b" }
redb = "4"

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
